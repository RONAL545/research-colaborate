services:
  - type: web
    name: nexo-academico-api-pruebas
    runtime: python
    plan: free
    region: oregon
    branch: dev
    buildCommand: pip install -r backend/requirements.lock
    startCommand: python deploy/render_start.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: staging
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nexo-academico-db-pruebas
          property: connectionString
      - key: INSTITUTIONAL_DOMAINS
        value: '["unaj.edu.pe"]'

databases:
  - name: nexo-academico-db-pruebas
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    databaseName: nexo_trial
    user: nexo
    ipAllowList: []
